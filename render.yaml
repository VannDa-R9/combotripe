services:
  - type: web
    name: cambotrips-backend
    env: php
    plan: free
    region: singapore
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache && php artisan migrate --force && php artisan db:seed --force
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_NAME
        value: CamboTrips
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:C7+49gtizjumydYxOJ8o/77CiAMgW3QIwYen3l4f1MI=
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: cambotrips-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cambotrips-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: cambotrips-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cambotrips-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cambotrips-db
          property: password

databases:
  - name: cambotrips-db
    databaseName: cambotrips
    user: cambotrips_user
    plan: free
    region: singapore
